[package]
name = "service"
version = "0.1.0"
edition = "2024"

[dependencies]
schema-harvester = { version = "0.1.0", path = "../core" }
config = { version = "0.15.27", default-features = false, features = ["toml", "convert-case"] }
anyhow = "1.0.104"
tokio = { version = "1.53.3", features = ["full"] }
rdkafka = { version = "0.39.0", features = ["sasl", "ssl", "zstd"] }
hyper = "1.12.0"
hyper-util = { version = "0.1.21", features = ["server", "http1", "client", "client-legacy", "service", "tokio"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tower = { version = "0.5.3", features = ["util"] }
http = "1.5.0"
http-body-util = "0.1.5"
bytes = "1.12.1"
serde = "1.0.229"
serde_json = "1.0.154"
futures = "0.3.34"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.7"

[[bin]]
name = "harvesterd"
path = "src/main.rs"
