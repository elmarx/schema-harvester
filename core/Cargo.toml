[package]
name = "schema-harvester"
version = "0.1.0"
rust-version = "1.85.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Schema-Harvester is a crate derive a JSON schema from given JSON objects"
repository = "https://github.com/elmarx/schema-harvester"
homepage = "https://github.com/elmarx/schema-harvester"
authors = ["Elmar Athmer <elmar@athmer.org>"]


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde_json = "1.0.154"
strum = { version = "0.28.0", features = ["derive"] }
strum_macros = "0.28.0"
serde = { version = "1.0.229", features = ["derive"] }
uuid-simd = "0.8.0"

[dev-dependencies]
jsonschema = "0.58.6"
test-case = "3.4.0"
